apiVersion: v1
kind: Pod
metadata: 
  name: conv-app-port
  labels: 
    components: frontend
spec:  
  containers:
  - name: conv-app
    image: antonlarichev/conv-app:1.2
    imagePullPolicy: IfNotPresent 
    ports:
      - containerPort: 81
    resources:
      limits:
        memory: "128Mi"
        cpu: "500m"

